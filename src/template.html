<!DOCTYPE html>
    <html lang="zh-CN" data-theme-key="so_theme">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22 fill=%22none%22 stroke=%22%230069ad%22 stroke-width=%221.5%22 stroke-linecap=%22round%22><circle cx=%226%22 cy=%226%22 r=%224.3%22/><path d=%22M10.2%2010.2%2014.2%2014.2%22/></svg>">
    <script>
      // 主题在样式之前确定，避免首屏闪烁；存储键与 client.js 共用 html 上的 data-theme-key
      (function () {
        var key = document.documentElement.dataset.themeKey;
        var saved;
        try {
          saved = localStorage.getItem(key);
        } catch (e) {}
        if (saved !== 'light' && saved !== 'dark') {
          saved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = saved;
      })();
    </script>
    <style>
{{styles}}
    </style>
    </head>
    <body>
    <div class="container">
        <header class="topbar">
            <h1>so</h1>
            <button id="themeToggle" class="theme-toggle" type="button" aria-label="切换到深色"><span class="theme-symbol" aria-hidden="true"></span></button>
        </header>
        <div class="search-container">
            <div class="form-wrapper">
              <form id="searchForm" action="/" method="GET" role="search">
                <div class="input-wrapper">
                  <span class="search-symbol" aria-hidden="true"></span>
                  <input type="text" id="searchInput" name="query" placeholder="搜索..." value="{{keyword}}" autocomplete="off" aria-label="搜索关键词" aria-describedby="error" enterkeyhint="search"/>
                  <button type="button" id="clearButton" class="clear-button" aria-label="清空关键词"><span class="close-symbol" aria-hidden="true"></span></button>
                </div>
                <button type="button" id="historyDropdownBtn" class="history-dropdown-btn" title="搜索历史" aria-label="搜索历史" aria-controls="historyDropdown" aria-expanded="false"><span class="clock" aria-hidden="true"></span></button>
                <div id="historyDropdown" class="history-dropdown">
                  <div class="history-heading">最近搜索</div>
                  <div id="historyList" class="history-list"></div>
                </div>
              </form>
            </div>
        </div>
        <p id="error" class="error" role="alert">{{error}}</p>
        <div id="currentSearchDisplay" class="current-search" style="{{current_search_style}}"><span class="current-search-label">当前搜索</span><span class="current-search-keyword">{{current_search}}</span></div>
        <div class="button-container">
            {{button_list}}
        </div>
    </div>

    <script type="application/json" id="client-config">{{client_config}}</script>
    <script>
{{client_script}}
    </script>
    </body>
    </html>
