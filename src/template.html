<!DOCTYPE html>
    <html lang="zh-CN">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔍</text></svg>">
    <style>
{{styles}}
    </style>
    </head>
    <body>
    <div class="container">
        <h1>so</h1>
        <div class="search-container">
            <div class="form-wrapper">
              <form id="searchForm" action="/" method="GET">
                <div class="input-wrapper">
                  <input type="text" id="searchInput" name="query" placeholder="搜索..." value="{{keyword}}" enterkeyhint="search"/>
                  <button type="button" id="clearButton" class="clear-button">×</button>
                </div>
                <button type="button" id="historyDropdownBtn" class="history-dropdown-btn" title="搜索历史"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></button>
                <div id="historyDropdown" class="history-dropdown">
                  <div id="historyList" class="history-list"></div>
                </div>
              </form>
            </div>
        </div>
        <div id="currentSearchDisplay" class="current-search" style="{{current_search_style}}"><span class="current-search-label">当前搜索</span><span class="current-search-keyword">{{current_search}}</span></div>
        <div class="button-container">
            {{button_list}}
        </div>
    </div>

    <script type="application/json" id="client-config">{{client_config}}</script>
    <script>
{{client_script}}
    </script>
    </body>
    </html>
