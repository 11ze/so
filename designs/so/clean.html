let savedTheme;

<script>
/**
 * 安全工具模块
 * 提供 XSS 防护、HTML 转义、URL 验证等安全功能
 */

/**
 * HTML 实体编码表
 */
const HTML_ENTITIES = {
  '&': '&amp;',
  '<': '&lt;',
  '>': '&gt;',
  '"': '&quot;',
  "'": '&#x27;',
  '/': '&#x2F;',
  '`': '&#x60;',
  '=': '&#x3D;',
};

/**
 * 预编译的 XSS 攻击模式正则表达式
 * 避免在每次函数调用时重复创建,提升性能
 */
const XSS_PATTERNS = [
  /<script/i,
  /javascript:/i,
  /\bon\w+\s*=/i, // onclick=, onload= 等（词边界避免误杀 money=100 这类 on 在词中的查询）
  /<iframe/i,
  /<embed/i,
  /<object/i,
  /<link/i,
  /<meta/i,
  /<style/i,
  /expression\s*\(/i,
];

/**
 * 转义 HTML 特殊字符,防止 XSS 攻击
 * @param {string} str - 需要转义的字符串
 * @returns {string} 转义后的字符串
 */
function escapeHtml(str) {
  if (typeof str !== 'string') {
    return '';
  }

  return String(str).replace(/[&<>"'`=\/]/g, (char) => HTML_ENTITIES[char] || char);
}

/**
 * 转义 HTML 属性值
 * @param {string} str - 需要转义的属性值
 * @returns {string} 转义后的字符串
 */
function escapeHtmlAttribute(str) {
  if (typeof str !== 'string') {
    return '';
  }

  // 属性值需要转义引号和其他特殊字符
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#x27;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

/**
 * JSON 数据岛专用转义：JSON.stringify 不转义 /，
 * < 需转义为 \u003C 防止字符串值提前闭合 <script> 标签
 * @param {*} value - 可 JSON 序列化的值
 * @returns {string} 可安全内联到 <script> 的 JSON 文本
 */
function escapeJsonForScript(value) {
  return JSON.stringify(value).replace(/</g, '\\u003C');
}

/**
 * 验证并清理搜索关键词
 * @param {string} keyword - 搜索关键词
 * @param {Object} options - 配置选项
 * @returns {Object} { valid: boolean, cleaned: string, error?: string }
 */
function validateAndCleanKeyword(keyword, options = {}) {
  const {
    maxLength = 500, // 最大长度限制(默认 500)
    minLength = 0,   // 最小长度限制(默认 0)
    allowEmpty = false, // 是否允许空字符串(默认 false)
  } = options;

  // 如果为 null 或 undefined
  if (keyword == null) {
    return {
      valid: allowEmpty,
      cleaned: '',
      error: allowEmpty ? undefined : '搜索关键词不能为空',
    };
  }

  // 转换为字符串
  const str = String(keyword);

  // 检查长度
  if (str.length > maxLength) {
    return {
      valid: false,
      cleaned: '',
      error: `搜索关键词长度不能超过 ${maxLength} 个字符`,
    };
  }

  if (str.length < minLength) {
    return {
      valid: false,
      cleaned: '',
      error: `搜索关键词长度不能少于 ${minLength} 个字符`,
    };
  }

  // 去除首尾空白
  const trimmed = str.trim();

  if (!allowEmpty && trimmed.length === 0) {
    return {
      valid: false,
      cleaned: '',
      error: '搜索关键词不能为空',
    };
  }

  // 检测潜在的 XSS 攻击模式
  // 使用预编译的正则表达式常量,避免重复创建,提升性能
  for (const pattern of XSS_PATTERNS) {
    if (pattern.test(trimmed)) {
      return {
        valid: false,
        cleaned: '',
        error: '搜索关键词包含非法字符',
      };
    }
  }

  return {
    valid: true,
    cleaned: trimmed,
  };
}

/**
 * 验证 URL 是否安全
 * @param {string} url - 需要验证的 URL
 * @returns {boolean} 是否安全
 */
function isValidUrl(url) {
  if (typeof url !== 'string') {
    return false;
  }

  try {
    const parsed = new URL(url);

    // 只允许 http 和 https 协议
    // 这已经涵盖了所有危险协议(javascript:, data:, vbscript:, file:, ftp: 等)
    // 因为它们无法被 URL 构造函数解析为合法的 URL
    return ['http:', 'https:'].includes(parsed.protocol);
  } catch (e) {
    // URL 解析失败,包括:
    // - 伪协议(javascript:, data:, vbscript: 等)
    // - 格式错误的 URL
    return false;
  }
}

/**
 * 安全地编码 URL 参数
 * @param {string} str - 需要编码的字符串
 * @returns {string} 编码后的字符串
 */
function encodeUrlParam(str) {
  if (typeof str !== 'string') {
    return '';
  }

  // 使用 encodeURIComponent 进行 URL 编码
  return encodeURIComponent(str);
}

/**
 * 生成 CSP 头部值
 * 本站策略：单文件页面需允许内联脚本/样式，搜索引擎图标需要开放图片来源
 * @returns {string} CSP 头部值
 */
function generateCSP() {
  return [
    "default-src 'self'",
    "script-src 'self' 'unsafe-inline'",
    "style-src 'self' 'unsafe-inline'",
    'img-src * data:',
    "connect-src 'self'",
    "font-src 'self'",
    "object-src 'none'",
    "media-src 'self'",
    "frame-src 'self'",
    "base-uri 'self'",
    "form-action 'self'",
    "frame-ancestors 'none'", // 防止被嵌入 iframe
    'upgrade-insecure-requests',
  ].join('; ');
}

/**
 * 生成推荐的安全响应头
 * @returns {Object} 安全头部对象
 */
function getSecurityHeaders() {
  return {
    'X-Content-Type-Options': 'nosniff',
    'X-Frame-Options': 'DENY',
    'Referrer-Policy': 'strict-origin-when-cross-origin',
    'Permissions-Policy': 'geolocation=(), microphone=(), camera=()',
    'Content-Security-Policy': generateCSP(),
    'Strict-Transport-Security': 'max-age=31536000; includeSubDomains; preload',
  };
}

/**
 * 验证图标 URL 是否安全
 * @param {string} iconUrl - 图标 URL
 * @param {Object} [options={}] - 配置选项(可选)
 * @param {number} [options.maxDataUriSize=102400] - data URI 最大大小(字节),默认 100KB
 * @returns {boolean} 是否安全
 */
function isValidIconUrl(iconUrl, options = {}) {
  const {
    maxDataUriSize = 100 * 1024, // 默认 100KB
  } = options || {};

  if (!iconUrl || typeof iconUrl !== 'string') {
    return false;
  }

  const trimmed = iconUrl.trim();

  // 允许 data:image (base64 图片)
  if (trimmed.startsWith('data:image/')) {
    // 限制 data URI 大小(防止 DOS 攻击)
    if (trimmed.length > maxDataUriSize) {
      return false;
    }

    // 验证 data URI 格式
    return /^data:image\/(png|jpg|jpeg|gif|svg\+xml|ico|webp);base64,[a-zA-Z0-9+/=]+$/i.test(trimmed);
  }

  // 其他 URL 需要通过标准 URL 验证
  return isValidUrl(trimmed);
}

const engines = [{"name":"Google","url":"https://www.google.com/search?q=%s","icon":"assets/icon-0.ico"},{"name":"DuckDuckGo","url":"https://duckduckgo.com/?q=%s&ia=web","icon":"assets/icon-1.ico"},{"name":"Bing","url":"https://www.bing.com/search?q=%s","icon":"assets/icon-2.ico"},{"name":"搜狗","url":"https://www.sogou.com/web?query=%s","icon":"assets/icon-3.ico"},{"name":"Google V2EX","url":"https://www.google.com/search?q=site:v2ex.com/t%20%s","icon":"assets/icon-4.ico"},{"name":"SOV2EX","url":"https://www.sov2ex.com/?q=%s&ref=opensearch","icon":"assets/icon-5.ico"},{"name":"YouTube","url":"https://www.youtube.com/results?search_query=%s","icon":"assets/icon-6.ico"},{"name":"小红书","url":"https://www.xiaohongshu.com/search_result?keyword=%s&source=web_explore_feed","icon":"assets/icon-7.ico"},{"name":"哔哩哔哩","url":"https://search.bilibili.com/all?keyword=%s","icon":"assets/icon-8.ico"},{"name":"AGE","url":"https://www.agedm.io/search?query=%s","icon":"assets/icon-9.ico"},{"name":"樱花动漫","url":"https://www.yinhuadm.cc/vch/%s.html","icon":"assets/icon-10.ico"},{"name":"樱之空动漫","url":"https://www.skr2.cc/vodsearch/-------------/?wd=%s","icon":"assets/icon-11.ico"},{"name":"OmoFun","url":"https://omofun.in/vod/search.html?wd=%s","icon":"assets/icon-12.ico"},{"name":"豆瓣","url":"https://www.douban.com/search?q=%s","icon":"assets/icon-13.ico"}];
const themeToggle = document.querySelector('#themeToggle');
function updateThemeButton() {
  const dark = document.documentElement.dataset.theme === 'dark';
  const label = dark ? '切换到浅色' : '切换到深色';
  themeToggle.setAttribute('aria-label', label);
  themeToggle.title = label;
}
updateThemeButton();
themeToggle.onclick = () => {
  const theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = theme;
  try { localStorage.setItem(themeKey, theme); } catch {}
  updateThemeButton();
};
const input = document.querySelector('#searchInput');
const panel = document.querySelector('#historyPanel');
const trigger = document.querySelector('#historyTrigger');
const historyKey = 'so_design_search_history';
const maxHistory = 50;
const maxLength = 500;
function readHistory(){try{const items=JSON.parse(localStorage.getItem(historyKey)||'[]');return Array.isArray(items)?items.filter(item=>typeof item==='string'&&item.trim()&&validateAndCleanKeyword(item).valid).slice(0,maxHistory):[];}catch{return [];}}
function writeHistory(items){try{localStorage.setItem(historyKey,JSON.stringify(items));}catch{/* 存储被禁用时仍可搜索。 */}}
function closeHistory(){panel.hidden=true;trigger.setAttribute('aria-expanded','false');}
function syncClear(){document.querySelector('#clearButton').hidden=!input.value;document.querySelector('#error').hidden=true;input.removeAttribute('aria-invalid');}
function render(query,save=false){
 const result=validateAndCleanKeyword(query,{maxLength,allowEmpty:true});
 if(!result.valid){const error=document.querySelector('#error');error.textContent=result.error;error.hidden=false;input.setAttribute('aria-invalid','true');return false;}
 const value=result.cleaned;
 document.querySelector('#currentKeyword').textContent=value;
 document.querySelector('#currentSearch').hidden=!value;
 document.querySelector('#results').hidden=!value;
 document.title=value?'so · '+value:'so';
 const grid=document.querySelector('#engines');grid.replaceChildren();
 if(value){for(const engine of engines){const url=engine.url.replace('%s',encodeURIComponent(value));if(!isValidUrl(url))continue;const link=document.createElement('a');link.className='engine';link.href=url;link.target='_blank';link.rel='noopener noreferrer';const mark=document.createElement('span');mark.className='engine-mark';mark.setAttribute('aria-hidden','true');const icon=document.createElement('img');icon.src=engine.icon;icon.alt='';icon.onerror=()=>{icon.hidden=true;};mark.append(icon);const name=document.createElement('span');name.className='engine-name';name.textContent=engine.name;link.append(mark,name);grid.append(link);}}
 if(value&&save)writeHistory([value,...readHistory().filter(item=>item!==value)].slice(0,maxHistory));
 return true;
}
function search(){if(!input.value.trim())return;if(!render(input.value,true))return;const url=new URL(location.href);url.searchParams.set('q',input.value.trim());if(url.href!==location.href)history.pushState(null,'',url);closeHistory();}
function renderHistory(){const list=document.querySelector('#historyList');list.replaceChildren();const items=readHistory();if(!items.length){const empty=document.createElement('div');empty.className='history-empty';empty.textContent='暂无搜索历史';list.append(empty);return;}for(const query of items){const row=document.createElement('div');row.className='history-row';const button=document.createElement('button');button.type='button';button.className='history-query';button.textContent=query;button.onclick=()=>{input.value=query;syncClear();search();input.focus();};const remove=document.createElement('button');remove.type='button';remove.className='history-delete';const close=document.createElement('span');close.className='close-symbol';close.setAttribute('aria-hidden','true');remove.append(close);remove.setAttribute('aria-label','删除历史：'+query);remove.onclick=event=>{event.stopPropagation();writeHistory(readHistory().filter(item=>item!==query));renderHistory();trigger.focus();};row.append(button,remove);list.append(row);}}
document.querySelector('#searchForm').addEventListener('submit',event=>{event.preventDefault();search();});
input.addEventListener('input',syncClear);
document.querySelector('#clearButton').onclick=()=>{input.value='';syncClear();document.querySelector('#currentSearch').hidden=true;input.focus();};
trigger.onclick=()=>{if(!panel.hidden){closeHistory();return;}renderHistory();panel.hidden=false;trigger.setAttribute('aria-expanded','true');};
document.addEventListener('click',event=>{if(!panel.contains(event.target)&&!trigger.contains(event.target))closeHistory();});
document.addEventListener('keydown',event=>{if(event.key==='/'&&event.target.tagName!=='INPUT'){event.preventDefault();input.focus();}if(event.key==='Escape'&&!panel.hidden){closeHistory();trigger.focus();}});
window.addEventListener('popstate',()=>{input.value=new URL(location.href).searchParams.get('q')||'';syncClear();render(input.value);});
input.value=new URL(location.href).searchParams.get('q')||'';
syncClear();render(input.value,!!input.value);
if(!matchMedia('(pointer:coarse)').matches)input.focus();
</script>
</body>
</html>
